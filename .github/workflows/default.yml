name: Default

env:
  GO_VERSION: ^1.25

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
        id: go

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then echo "Files not formatted with gofmt:"; echo "$unformatted"; exit 1; fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Build
      run: make build

    - name: Cross-build linux/arm64
      run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .

    - name: Cross-build linux/arm/v6
      run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -o /dev/null .

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # avoid cache thrashing
        id: go

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout 3m
